<div style="width:100%;max-width:1200px;margin:0 auto">
  <iframe id="fotostallen-booking"
    src="https://kvitberg.github.io/fotostallen-booking/?embed=1"
    title="Book fotograf hos Fotostallen"
    style="width:100%;height:4800px;border:0;display:block"
    scrolling="no" loading="eager"></iframe>
</div>
<script>
  // Lar bookingsiden fortelle hvor høy den er, så rammen alltid passer innholdet.
  window.addEventListener("message", function (e) {
    if (e.origin !== "https://kvitberg.github.io") return;
    if (!e.data || e.data.type !== "fotostallen-booking-height") return;
    document.getElementById("fotostallen-booking").style.height = e.data.height + "px";
  });
</script>
